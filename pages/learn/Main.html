<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دروس تفاعلية | BlogArch</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     BLOGGER INTEGRATION — Scoped Root
     ═══════════════════════════════════════════════════════════ -->

<div id="ba-learn-root">
  <div class="ba-ambient">

    <!-- ══ SEARCH BAR ══ -->
    <header class="ba-search-bar" id="baSearchBar">
      <div class="ba-wrap">
        <div class="ba-search-row">
          <div class="ba-search-wrap">
            <i class="fas fa-search ba-search-icon" aria-hidden="true"></i>
            <input
              type="search"
              id="lessonSearch"
              class="ba-search-input"
              placeholder="ابحث في الدروس... (مثال: أفعال، محادثة، قواعد)"
              autocomplete="off"
              aria-label="البحث في الدروس"
            />
            <button class="ba-search-clear" id="clearSearch" aria-label="مسح البحث" type="button">
              <i class="fas fa-times" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- ══ FILTERS BAR ══ -->
    <nav class="ba-filters-bar" id="baFiltersBar">
      <div class="ba-wrap">
        <div class="ba-filters-row">

          <!-- Level filters -->
          <div class="ba-filter-pills" id="levelFilters" role="group" aria-label="تصفية حسب المستوى">
            <button class="ba-filter-pill active" data-level="all" type="button">
              <i class="fas fa-th-large" aria-hidden="true"></i>
              <span>الكل</span>
            </button>
            <button class="ba-filter-pill" data-level="beginner" type="button">
              <span class="ba-pill-dot beginner" aria-hidden="true"></span>
              <span>مبتدئ</span>
            </button>
            <button class="ba-filter-pill" data-level="intermediate" type="button">
              <span class="ba-pill-dot intermediate" aria-hidden="true"></span>
              <span>متوسط</span>
            </button>
            <button class="ba-filter-pill" data-level="advanced" type="button">
              <span class="ba-pill-dot advanced" aria-hidden="true"></span>
              <span>متقدم</span>
            </button>
          </div>

          <!-- Quick tags -->
          <div class="ba-quick-tags" id="searchTags" aria-label="بحث سريع">
            <span class="ba-tags-label">بحث سريع:</span>
            <button class="ba-tag" data-search="أفعال" type="button">أفعال</button>
            <button class="ba-tag" data-search="حروف" type="button">حروف</button>
            <button class="ba-tag" data-search="محادثة" type="button">محادثة</button>
            <button class="ba-tag" data-search="قواعد" type="button">قواعد</button>
            <button class="ba-tag" data-search="مفردات" type="button">مفردات</button>
          </div>

          <!-- Sort + View Controls -->
          <div class="ba-controls-right">
            <select class="ba-sort-select" id="sortSelect" aria-label="ترتيب الدروس">
              <option value="default">الترتيب الافتراضي</option>
              <option value="name">أبجدياً</option>
              <option value="level">حسب المستوى</option>
              <option value="completed">المكتملة أولاً</option>
            </select>
            <div class="ba-view-toggle" id="viewToggle" role="group" aria-label="طريقة العرض">
              <button class="ba-view-btn active" data-view="grid" title="عرض شبكي" aria-pressed="true" type="button">
                <i class="fas fa-th-large" aria-hidden="true"></i>
              </button>
              <button class="ba-view-btn" data-view="list" title="عرض قائمة" aria-pressed="false" type="button">
                <i class="fas fa-list" aria-hidden="true"></i>
              </button>
            </div>
          </div>

        </div>
      </div>
    </nav>

    <!-- ══ SECTION HEADER ══ -->
    <section class="ba-section-header">
      <div class="ba-wrap">
        <h1 class="ba-section-title">
          دروس تعليمية <span class="ba-title-accent">تفاعلية</span>
        </h1>
        <p class="ba-section-subtitle">
          اختر الدرس المناسب لمستواك وابدأ رحلة التعلم بقراءة مريحة وواضحة
        </p>
      </div>
    </section>

    <!-- ══ LESSONS GRID ══ -->
    <main class="ba-wrap">
      <!-- Hidden stats for JS -->
      <span id="totalLessons" style="display:none">0</span>
      <span id="completedLessons" style="display:none">0</span>
      <span id="favCount" style="display:none">0</span>
      <span id="streakDays" style="display:none">1</span>

      <div class="ba-lessons-grid" id="lessonsGrid" role="list" aria-label="قائمة الدروس"></div>

      <!-- Empty state -->
      <div class="ba-empty-state" id="emptyState" style="display:none" aria-live="polite">
        <div class="ba-empty-icon" aria-hidden="true">
          <i class="fas fa-search"></i>
        </div>
        <h3>لا توجد نتائج</h3>
        <p>حاول البحث بكلمات مختلفة أو تغيير الفلاتر</p>
        <button class="ba-btn-primary" id="resetFiltersBtn" type="button">
          <i class="fas fa-redo" aria-hidden="true"></i>
          <span>إعادة ضبط</span>
        </button>
      </div>
    </main>

    <!-- ══ LESSON MODAL ══ -->
    <div id="lessonModal" class="lesson-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-backdrop"></div>
      <div class="modal-container">

        <header class="modal-header">
          <div class="modal-title-wrap">
            <h2 id="modalTitle" class="modal-title">عنوان الدرس</h2>
            <span id="modalSubtitle" class="modal-subtitle">English Title</span>
          </div>
          <div class="modal-actions">
            <button class="icon-btn" id="fullscreenBtn" title="ملء الشاشة" aria-label="ملء الشاشة" type="button">
              <i class="fas fa-expand" aria-hidden="true"></i>
            </button>
            <button class="icon-btn close-btn" id="closeModal" title="إغلاق (Esc)" aria-label="إغلاق" type="button">
              <i class="fas fa-times" aria-hidden="true"></i>
            </button>
          </div>
        </header>

        <div class="modal-toolbar">
          <button class="nav-arrow" id="prevLesson" aria-label="الدرس السابق" type="button">
            <i class="fas fa-chevron-right" aria-hidden="true"></i>
            <span>السابق</span>
          </button>
          <div class="lesson-indicator" aria-live="polite">
            <span id="currentIndex">1</span> / <span id="totalIndex">26</span>
          </div>
          <div class="reading-controls">
            <button class="tool-btn" id="fontSizeBtn" aria-label="تكبير الخط" type="button">
              <i class="fas fa-font" aria-hidden="true"></i>
            </button>
            <button class="tool-btn" id="readingModeBtn" aria-label="وضع القراءة" type="button">
              <i class="fas fa-book-open" aria-hidden="true"></i>
            </button>
          </div>
          <button class="nav-arrow" id="nextLesson" aria-label="الدرس التالي" type="button">
            <span>التالي</span>
            <i class="fas fa-chevron-left" aria-hidden="true"></i>
          </button>
        </div>

        <div class="modal-body">
          <div class="iframe-container" id="iframeContainer">
            <div class="iframe-loader" id="iframeLoader">
              <div class="spinner" aria-hidden="true"></div>
              <p>جاري تحميل الدرس...</p>
            </div>
            <iframe id="lessonIframe" title="Lesson Viewer" allowfullscreen></iframe>
          </div>
        </div>

        <footer class="modal-footer">
          <button class="ba-btn-complete" id="markCompleteBtn" type="button">
            <i class="fas fa-check-circle" aria-hidden="true"></i>
            <span>تحديد كمكتمل</span>
          </button>
        </footer>
      </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  </div><!-- .ba-ambient -->
</div><!-- #ba-learn-root -->

<!-- Scripts -->
<script src="lessons-data.js"></script>
<script src="script.js"></script>

</body>
</html>
